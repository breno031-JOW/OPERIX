[project]
name = "operix"
version = "1.0.0"
description = "Sistema desktop de gestão de clientes, orçamentos e ordens de serviço (Tkinter + SQLite)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ordem-de-servico", "erp", "tkinter", "sqlite", "gestao"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Office/Business",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
operix = "operix.ui.app:main"

[tool.setuptools.packages.find]
include = ["operix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
