[project]
name = "operix"
version = "2.0.0"
description = "Sistema desktop de gestão para oficinas mecânicas: OS, estoque, financeiro e PDFs (Tkinter + SQLite)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ordem-de-servico", "oficina-mecanica", "erp", "tkinter", "sqlite", "gestao"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Portuguese (Brazilian)",
    "Topic :: Office/Business",
]
dependencies = ["ttkbootstrap==1.10.1", "fpdf2>=2.7", "pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
operix = "operix.ui.app:main"

[tool.setuptools.packages.find]
include = ["operix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP006", "UP007", "UP035", "UP045"]
